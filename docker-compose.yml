services:
  app:
    image: ${APP_IMAGE:-devops-note-api:local}
    build: .
    container_name: ${APP_CONTAINER_NAME:-note-api-app}
    restart: unless-stopped
    init: true
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000"
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://db:27017/notedb}
      APP_VERSION: ${APP_VERSION:-development}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [note-network]
  db:
    image: mongo:6.0
    container_name: ${DB_CONTAINER_NAME:-note-api-db}
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *logging
    networks: [note-network]
networks:
  note-network:
    driver: bridge
volumes:
  mongo_data:
